- role: system
  content: |
    You are an expert synthetic data generator for Thai telecom customer service chatbot training data.
    You generate realistic Thai-language multi-turn chat conversations for intent classification training.

    IMPORTANT RULES:
    - Generate data in Thai language (with occasional English loanwords like "roaming", "package", "data", "bill", "due date", "postpaid", "prepaid" as Thai users naturally mix them)
    - Phone numbers should use the format 0XXXXXXXX with XX masking like "091234XXXX"
    - OTP codes should always be masked as "XXXXXX"
    - The assistant responses should be polite, professional Thai customer service style (using ค่ะ/คะ particles)
    - Include realistic telco-specific details: package names, prices in Thai Baht, data amounts, dates
    - Some examples should include [Options: {...}] in assistant responses for interactive choices
    - Make user messages contextually consistent with the session_history

    CRITICAL CONSTRAINT - SLIDING WINDOW:
    The real system uses a sliding window of the last 5 messages. Therefore:
    - session_history MUST contain AT MOST 5 messages (max 5 objects in the array)
    - Valid lengths are ONLY: 0, 2, 4, or 5 messages. NEVER use 1 or 3.
    - Roles MUST strictly alternate between user and assistant
    - 2 message history: [user, assistant]
    - 4 message history: [user, assistant, user, assistant]
    - 5 message history: [assistant, user, assistant, user, assistant]
      (starts with assistant because the user's first message was trimmed by the sliding window)

    TYPOS AND INFORMAL LANGUAGE - VERY IMPORTANT:
    Real Thai chat users make frequent typos and use informal language. You MUST include these patterns in at least 8-10 of the 20 examples:
    - Common Thai typos: "เนต" instead of "เน็ต", "มัย" instead of "ไหม", "เเ" instead of "แ", "ค้าบ" instead of "ครับ", "ค่าาา" with extra vowels, "ลืืม" with doubled vowels, missing tone marks, swapped consonants
    - Misspelled Thai words: "ตรจสอบ" instead of "ตรวจสอบ", "รบกวณ" instead of "รบกวน", "รายละเอียก" instead of "รายละเอียด", "กานใช้งาน" instead of "การใช้งาน"
    - Informal/slang: "555" for laughter, "ป่าว/ปะ/มะ" for question particles, "อ่า/อะ" as filler, "จ้า/จ๊า" as particles, "พั่" for emphasis
    - Missing spaces, run-on words, mixed Thai-English in a single word
    - Emoji usage: 😅 🙏 😭 💸 📱 ⚠️ etc.
    - The assistant can also have occasional typos (like real agents): "ตรจสอบ", "รบกวณ", "เพิ้ม"

    SENTENCE & WORD DIVERSITY - VERY IMPORTANT:
    Real users express the same intent in wildly different ways. You MUST vary sentence structure and word choice across the {{ num_examples }} examples. Do NOT repeat the same phrasing patterns:
    - Vary the verb: "เช็ค", "ดู", "อยากรู้", "ขอ", "ช่วย...ให้หน่อย", "...เท่าไหร่", "...ยังไง", "ถาม", "สอบถาม"
    - Vary sentence form: questions ("ยอดเท่าไหร่?"), statements ("อยากเช็คยอด"), imperatives ("ช่วยดูยอดให้หน่อย"), fragments ("ยอดค้างชำระ"), conversational ("เอ่อ พอดีจะดูยอดน่ะ")
    - Vary directness: very direct ("เช็คบิล"), indirect/polite ("รบกวนสอบถามยอดค่าบริการหน่อยได้ไหมคะ"), casual ("บิลเดือนนี้เท่าไหร่อ่ะ")
    - Vary message length: single word/phrase ("ยอดค้างชำระ"), short sentence ("เช็คยอดหน่อย"), long sentence with context ("สวัสดีค่ะ พอดีว่าเดือนนี้ยังไม่ได้จ่ายบิล อยากเช็คยอดค้างชำระหน่อยค่ะ")
    - Avoid starting more than 2-3 examples with the same opening word or phrase
    - Each user_message should feel like it came from a DIFFERENT person with a different communication style

    INTENT CHANGES IN HISTORY - VERY IMPORTANT:
    In real chat, users often switch topics mid-conversation. At least 5-6 of the 20 examples MUST have session_history where the previous conversation was about a DIFFERENT topic/intent before the user switches to the current intent. Examples of topic switches:
    - User was asking about signal/network issues, then switches to asking about billing
    - User was inquiring about a new phone/device, then asks about their data package
    - User was checking roaming, then asks about unsubscribing a package
    - User was complaining about slow internet, then asks about payment status
    - User was asking about SIM activation, then asks about due dates
    - User was asking about promotions, then switches to checking balance
    The user_message (which is the CURRENT message to classify) must match the target intent, but the history shows the previous different topic.

- role: user
  content: |
    Generate exactly {{ num_examples }} new training examples for the intent: {{ intent }}

    Here is a description of this intent:
    {{ intent_description }}

    Here are {{ num_seed }} existing examples for reference (follow this exact JSON format and conversational style):

    {{ seed_examples }}

    REQUIREMENTS:
    1. Output MUST be a valid JSON array
    2. Each object has exactly 3 fields: "user_message", "intent", "session_history"
    3. "session_history" is an array of {"role": "user"|"assistant", "content": "..."} objects
    4. session_history lengths and role ordering MUST follow these exact patterns:
       - 2 examples with empty session_history []
       - 4 examples with 2 messages: [user, assistant]
       - 7 examples with 4 messages: [user, assistant, user, assistant]
       - 7 examples with 5 messages: [assistant, user, assistant, user, assistant]
       The 5 message pattern starts with assistant because it represents a sliding window
       where the user's earliest message was trimmed. NEVER use lengths 1 or 3.
       Roles MUST strictly alternate between user and assistant.
    5. The user_message must be semantically aligned with the intent and make sense given the session_history
    6. At least 5-6 examples MUST have session_history about a COMPLETELY DIFFERENT topic (intent change / topic switch)
    7. At least 8-10 examples MUST contain realistic Thai typos, misspellings, informal slang, or emoji in user_message
    8. Include variety: formal/informal register, male/female particles (ครับ/ค่ะ), with/without emoji
    9. Some examples should have the user providing a phone number as their message
    10. Some examples should have the user confirming/responding to options presented by the assistant
    11. Include 2-3 examples in English (informal, with grammar mistakes as non-native speakers would write)

    Output ONLY the JSON array, no markdown formatting, no explanation, no thinking tags.

    [OUTPUT]

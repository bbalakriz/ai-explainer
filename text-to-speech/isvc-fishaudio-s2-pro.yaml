apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  annotations:
    opendatahub.io/connections: fishaudio-s2-pro
    opendatahub.io/hardware-profile-name: nvidia-gpu
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    opendatahub.io/hardware-profile-resource-version: "5241459"
    opendatahub.io/model-type: generative
    openshift.io/description: ""
    openshift.io/display-name: fishaudio-s2-pro
    security.opendatahub.io/enable-auth: "false"
    serving.kserve.io/deploymentMode: RawDeployment
    serving.kserve.io/stop: "true"
  labels:
    networking.kserve.io/visibility: exposed
    opendatahub.io/dashboard: "true"
  name: fishaudio-s2-pro
  namespace: decoder-sft
spec:
  predictor:
    automountServiceAccountToken: false
    deploymentStrategy:
      type: Recreate
    maxReplicas: 1
    minReplicas: 1
    model:
      modelFormat:
        name: vllm-omni
      name: ""
      resources:
        limits:
          cpu: "4"
          memory: 48Gi
          nvidia.com/gpu: "1"
        requests:
          cpu: "4"
          memory: 24Gi
          nvidia.com/gpu: "1"
      runtime: fishaudio-s2-pro
      storageUri: hf://fishaudio/s2-pro
    tolerations:
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Equal
